name: ci / nix

# Triggers conservatively to avoid taxing every code-only PR with a
# ~5-min nix install + build:
#
# - pull_request: only when nix-relevant files actually change.
# - push to master: post-merge smoke test (catches merge_group bypass).
# - schedule: weekly cron to catch external breakage (nimble release,
#   nixpkgs bump) that no in-repo file change would otherwise surface —
#   i.e. "does the committed pin still build?".
# - workflow_dispatch: manual trigger for ad-hoc validation (e.g.
#   after bumping the libp2p pin in libp2p_mix.nimble).
on:
  pull_request:
    paths:
      - 'libp2p_mix.nimble'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'Makefile'
      - 'tools/gen-deps.sh'
      - 'tools/check-libp2p-pin.sh'
      - '.github/workflows/ci-nix.yml'
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # GitHub-hosted runners don't ship nix; install via the
      # DeterminateSystems action (faster cold install than the
      # cachix one). If self-hosted runners with nix preinstalled
      # become available for this repo, drop this step.
      # Pinned to tagged releases (not @main) for supply-chain safety.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Use Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      # We deliberately do NOT regenerate nix/deps.nix here. Regenerating
      # runs `nimble lock`, which re-resolves the nimble file's open ranges
      # ("chronos >= 4.2.2", plus everything transitive via libp2p) to each
      # dep's current default-branch HEAD. Those HEADs move daily, so a
      # regenerated file can never match a committed one: the old check
      # failed on unrelated upstream activity rather than on anything the
      # PR did, and was red on master and every weekly cron for a month.
      #
      # nix/deps.nix is a committed pin (exact rev + sha256 per dep), so the
      # build below already proves it resolves and compiles. The one thing a
      # PR controls — bumping libp2p without regenerating the pin — is
      # deterministic and checked here.
      - name: Verify libp2p pin matches libp2p_mix.nimble
        run: ./tools/check-libp2p-pin.sh

      - name: nix build
        run: nix build -L

      - name: Show build outputs
        run: find result -type f | head -50
