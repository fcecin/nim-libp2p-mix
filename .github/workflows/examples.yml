name: Examples

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  example:
    name: Build mix_ping example
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.6'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache nimble deps
        uses: actions/cache@v5
        with:
          path: ~/.nimble
          key: nimble-examples-${{ hashFiles('libp2p_mix.nimble') }}

      - name: Install deps
        run: nimble install -dy

      # --solver:legacy is required on every nimble task invocation while
      # libp2p_mix.nimble pins libp2p to a git commit. nimble's default
      # SAT solver can't resolve multiple transitive git pins (libp2p +
      # its boringssl/websock/jwt pins) and re-resolves deps on each
      # task call. Drop the flag once libp2p_mix pins libp2p by version.
      - name: Set up project paths
        run: nimble --solver:legacy setup

      - name: Build mix_ping
        run: nimble --solver:legacy example
